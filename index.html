<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Mauritius — Key Statistics</title>
<style>
:root{
  --ink:#0b1b4c;--muted:#60708e;--line:#dce7f2;--card:#fff;
  --social:#eaf4ff;--economic:#e9f5ff;--env:#e8f8f5;
  --blue:#0d6fe8;--blue2:#67b8f5;--green:#18a48f;--green2:#7dd8c8;
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#fff}
.wrap{width:100%;margin:0;padding:16px 14px 28px}
.hero{margin-bottom:16px}
.hero h1{font-size:42px;line-height:1.05;margin:6px 0 10px;color:#111f5a}
.pillar{border-radius:16px;padding:12px;margin:16px 0}
.social{background:var(--social)} .economic{background:var(--economic)} .environment{background:var(--env)}
.pillar-head{display:flex;align-items:center;gap:10px;padding:2px 4px 10px}
.badge{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:bold;background:linear-gradient(135deg,#0878ef,#0a4da4);flex:0 0 auto}
.environment .badge{background:linear-gradient(135deg,#16a995,#087565)}
.pillar-head h2{font-size:26px;margin:0;white-space:nowrap}
.tag{font-size:13px;color:#335987}
.strap{margin-left:auto;font-size:13px;color:#315a88;text-align:right;max-width:40%}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:9px;width:100%}
.card{background:#fff;border:1px solid rgba(14,76,145,.08);border-radius:11px;min-height:124px;padding:12px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 1px 0 rgba(10,36,95,.03)}
.icon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e8f3ff;font-size:21px;flex:0 0 auto}
.environment .icon{background:#dff3ee}
.label{font-size:12.5px;font-weight:700;line-height:1.22;margin-bottom:5px}
.value{font-size:24px;font-weight:800;line-height:1.05;color:#0c1b57}
.period{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.25}
.card-source,.chart-source{font-size:10.5px;margin-top:7px;line-height:1.25}
.card-source a,.chart-source a{color:#3d6592;text-decoration:underline;text-underline-offset:2px}
.visual-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.chart-card,.story-card,.ocean-card{background:#fff;border:1px solid rgba(14,76,145,.08);border-radius:11px;padding:14px;overflow:hidden}
.chart-card h3,.story-card h3{margin:0 0 4px;font-size:19px}
.chart-sub{font-size:13px;color:var(--muted);margin-bottom:12px;line-height:1.35}
.bar-list{display:grid;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(120px,1fr) minmax(120px,2fr) 70px;gap:10px;align-items:center}
.bar-label{font-size:12px;color:#425a7c}
.bar-track{height:15px;border-radius:999px;background:#edf2f7;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:#0d6fe8}
.environment .bar-fill{background:#18a48f}
.bar-value{text-align:right;font-size:12px;font-weight:800;color:#0c1b57}
.donut-wrap{display:grid;grid-template-columns:180px 1fr;gap:22px;align-items:center;min-height:210px}
.donut{width:170px;height:170px;border-radius:50%;position:relative;margin:auto}
.donut:after{content:"";position:absolute;inset:32px;background:#fff;border-radius:50%}
.legend{display:grid;gap:10px}
.legend-row{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;font-size:13px}
.swatch{width:12px;height:12px;border-radius:3px}
.legend-label{color:#425a7c}.legend-value{font-weight:800;color:#0c1b57}
.line-chart{height:210px;position:relative;padding:12px 15px 28px 40px}
.line-chart svg{width:100%;height:100%;overflow:visible}
.grid{stroke:#e8eef5;stroke-width:1}.path{fill:none;stroke:#0d6fe8;stroke-width:3}.dot{fill:#fff;stroke:#0d6fe8;stroke-width:2}
.xlabels{display:grid;gap:0;margin:0 15px 0 40px;font-size:10px;color:#667892}
.xlabels span{text-align:center}
.ocean-card{margin-bottom:10px;display:grid;grid-template-columns:minmax(180px,.6fr) 1fr;gap:18px;align-items:center}
.ocean-big{font-size:38px;font-weight:800;color:#087565}
.ocean-label{font-size:13px;font-weight:700;color:#3f6283;text-transform:uppercase;margin-top:4px}
.ocean-text{font-size:14px;line-height:1.45;color:#365270}
.climate-panel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.climate-stat{background:rgba(255,255,255,.8);border-radius:11px;padding:18px;text-align:center}
.climate-stat strong{display:block;font-size:32px;color:#087565;margin-bottom:5px}
.climate-stat span{font-size:13px;color:#46647a}
.updated-stamp{padding:14px 4px 0;text-align:right;font-size:13px;color:#4e6380;line-height:1.4}
.error{padding:20px;border:1px solid #e0a5a5;background:#fff6f6;border-radius:10px;color:#7b1e1e}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.visual-grid{grid-template-columns:1fr}}
@media(max-width:760px){.pillar-head{align-items:flex-start;flex-wrap:wrap}.strap{margin-left:64px;text-align:left;width:100%;max-width:none}.donut-wrap,.ocean-card{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:14px 10px}.hero h1{font-size:34px}.cards{grid-template-columns:1fr}.value{font-size:27px}.pillar-head h2{font-size:23px}.bar-row{grid-template-columns:1fr}.bar-value{text-align:left}.climate-panel{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app" class="wrap">Loading…</div>
<script>
const DATA_URL = new URLSearchParams(location.search).get("data") || "data.json";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function cards(items){
  return `<div class="cards">${items.map(x=>`
    <div class="card"><div class="icon">${esc(x.icon)}</div><div>
      <div class="label">${esc(x.label)}</div>
      <div class="value">${esc(x.value)}</div>
      <div class="period">${esc(x.period)}</div>
      <div class="card-source">Source: <a href="${esc(x.sourceUrl)}" target="_blank" rel="noopener">${esc(x.source)}</a></div>
    </div></div>`).join("")}</div>`;
}
function bars(v){
  const max=Math.max(...v.series.map(x=>Number(x.value)),1);
  return `<div class="chart-card"><h3>${esc(v.title)}</h3><div class="chart-sub">${esc(v.subtitle)}</div>
  <div class="bar-list">${v.series.map(x=>`
    <div class="bar-row"><div class="bar-label">${esc(x.label)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(Number(x.value)/max*100).toFixed(1)}%"></div></div>
      <div class="bar-value">${esc(x.display??x.value)}</div>
    </div>`).join("")}</div>
  <div class="chart-source">Source: <a href="${esc(v.sourceUrl)}" target="_blank" rel="noopener">${esc(v.source)}</a></div></div>`;
}
function donut(v){
  const total=v.series.reduce((a,b)=>a+Number(b.value||0),0)||1;
  const colors=["#0d6fe8","#67b8f5","#18a48f","#7dd8c8"];
  let c=0;
  const stops=v.series.map((x,i)=>{let s=c;c+=Number(x.value)/total*100;return `${colors[i%colors.length]} ${s}% ${c}%`}).join(",");
  return `<div class="chart-card"><h3>${esc(v.title)}</h3><div class="chart-sub">${esc(v.subtitle)}</div>
  <div class="donut-wrap"><div class="donut" style="background:conic-gradient(${stops})"></div>
  <div class="legend">${v.series.map((x,i)=>`<div class="legend-row"><span class="swatch" style="background:${colors[i%colors.length]}"></span><span class="legend-label">${esc(x.label)}</span><span class="legend-value">${esc(x.display??x.value)}</span></div>`).join("")}</div></div>
  <div class="chart-source">Source: <a href="${esc(v.sourceUrl)}" target="_blank" rel="noopener">${esc(v.source)}</a></div></div>`;
}
function line(v){
  const vals=v.series.map(x=>Number(x.value)), max=Math.max(...vals), min=Math.min(...vals,0), W=800,H=150,pad=(max-min||1)*.15,lo=min-pad,hi=max+pad;
  const x=i=>v.series.length===1?W/2:i/(v.series.length-1)*W;
  const y=n=>H-((n-lo)/(hi-lo))*H;
  const pts=v.series.map((d,i)=>`${x(i)},${y(Number(d.value))}`).join(" ");
  return `<div class="chart-card"><h3>${esc(v.title)}</h3><div class="chart-sub">${esc(v.subtitle)}</div>
    <div class="line-chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      ${[0,1,2,3,4].map(i=>{let gv=lo+(hi-lo)*(i/4);return `<line class="grid" x1="0" x2="${W}" y1="${y(gv)}" y2="${y(gv)}"></line>`}).join("")}
      <polyline class="path" points="${pts}"></polyline>
      ${v.series.map((d,i)=>`<circle class="dot" cx="${x(i)}" cy="${y(Number(d.value))}" r="5"><title>${esc(d.label)}: ${esc(d.value)}${esc(v.suffix||"")}</title></circle>`).join("")}
    </svg></div>
    <div class="xlabels" style="grid-template-columns:repeat(${v.series.length},1fr)">${v.series.map(d=>`<span>${esc(d.label)}</span>`).join("")}</div>
    <div class="chart-source">Source: <a href="${esc(v.sourceUrl)}" target="_blank" rel="noopener">${esc(v.source)}</a></div></div>`;
}
function visual(v){return v.type==="bars"?bars(v):v.type==="donut"?donut(v):line(v)}
function pillar(cls,title,obj,extra=""){
  return `<section class="pillar ${cls}"><div class="pillar-head"><div class="badge">${cls==="environment"?"❧":"▥"}</div><h2>${title}</h2><div class="tag">${esc(obj.tag)}</div><div class="strap">${esc(obj.strap)}</div></div>${extra}${cards(obj.cards)}<div class="visual-grid">${(obj.visuals||[]).map(visual).join("")}</div>${cls==="environment"&&obj.climate&&obj.climate.length?`<div class="climate-panel">${obj.climate.map(c=>`<div class="climate-stat"><strong>${esc(c.value)}</strong><span>${esc(c.label)}</span></div>`).join("")}</div>`:""}</section>`
}
async function load(){
 try{
  const r=await fetch(DATA_URL,{cache:"no-store"}); if(!r.ok)throw new Error(`HTTP ${r.status}`);
  const d=await r.json();
  document.getElementById("app").innerHTML=`
   <div class="hero"><h1>${esc(d.meta.title)}</h1></div>
   ${pillar("social","SOCIAL",d.social)}
   ${pillar("economic","ECONOMIC",d.economic)}
   ${pillar("environment","ENVIRONMENTAL",d.environment)}
   <div class="updated-stamp"><strong>Data file updated:</strong> ${esc(d.meta.lastUpdated)}</div>`;
 }catch(e){document.getElementById("app").innerHTML=`<div class="error"><strong>Could not load data.</strong><br>${esc(e.message)}</div>`}
}
load();
</script>
</body>
</html>
